name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax-check every script
        run: |
          for f in skills/taste-mobile/scripts/*.mjs tools/*.mjs; do node --check "$f"; done
      - name: Tests
        run: node --test tests/*.test.mjs
      - name: Installer
        run: bash -n install.sh && ./install.sh --list
